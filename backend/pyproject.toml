[project]
name = "gallery-faces"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "python-multipart==0.0.34",
    "pillow==13.0.0",
    "numpy==2.5.5",
    "opencv-python-headless==5.0.0.93",
    "scikit-image==0.26.0",
    "gallery-dl==1.32.20",
    "onnxruntime==1.32.0",
    "threadpoolctl==3.8.0",
]
[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
